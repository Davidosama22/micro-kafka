name: micro-kafka

x-service: &service
  volumes:
    - .:/usr/src/app
    - /usr/src/app/node_modules
  restart: on-failure
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    mongo:
      condition: service_started

services:
  reservations:
    <<: *service
    build:
      context: ./
      dockerfile: ./apps/reservations/Dockerfile
      target: development
    command: npm run start:dev:reservations
    ports:
      - '3023:3003'
    env_file:
      - ./apps/reservations/.env

  auth:
    <<: *service
    build:
      context: ./
      dockerfile: ./apps/auth/Dockerfile
      target: development
    command: npm run start:dev:auth
    ports:
      - '3021:3001'
    env_file:
      - ./apps/auth/.env

  payments:
    <<: *service
    build:
      context: ./
      dockerfile: ./apps/payments/Dockerfile
      target: development
    command: npm run start:dev:payments
    env_file:
      - ./apps/payments/.env

  notifications:
    <<: *service
    build:
      context: ./
      dockerfile: ./apps/notifications/Dockerfile
      target: development
    command: npm run start:dev:notifications
    env_file:
      - ./apps/notifications/.env

  mongo:
    image: mongo
    ports:
      - '27018:27017'

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT is used by the containers, EXTERNAL by tests running on the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # kafkajs consumers can end up with no partitions if they subscribe before a topic exists.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for topic in authenticate authenticate.reply create_charge create_charge.reply notify_email; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1 || exit 1
        done
